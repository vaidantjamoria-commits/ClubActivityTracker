
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club Activity Tracker</title>

    <!-- CSS connection -->
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>ClubTracker</span>
        </div>

        <p class="menu-heading">MAIN MENU</p>

        <nav>
            <button class="nav-link active" data-page="dashboard">
                <i class="fa-solid fa-house"></i> Dashboard
            </button>

            <button class="nav-link" data-page="clubs">
                <i class="fa-solid fa-users"></i> Clubs
            </button>

            <button class="nav-link" data-page="members">
                <i class="fa-solid fa-user-plus"></i> Membership
            </button>

            <button class="nav-link" data-page="events">
                <i class="fa-solid fa-calendar-days"></i> Events
            </button>

            <button class="nav-link" data-page="attendance">
                <i class="fa-solid fa-clipboard-check"></i> Attendance
            </button>

            <button class="nav-link" data-page="announcements">
                <i class="fa-solid fa-bullhorn"></i> Announcements
            </button>

            <button class="nav-link" data-page="history">
                <i class="fa-solid fa-clock-rotate-left"></i> Activity History
            </button>

            <button class="nav-link" data-page="reports">
                <i class="fa-solid fa-chart-column"></i> Reports
            </button>
        </nav>

        <div class="sidebar-bottom">
            <div class="admin-profile">
                <div class="avatar">A</div>
                <div>
                    <strong>Administrator</strong>
                    <small>System Admin</small>
                </div>
            </div>
        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h2 id="page-title">Dashboard</h2>
                <p>Welcome back! Manage your campus activities.</p>
            </div>

            <div class="topbar-right">
                <span class="admin-label">
                    <i class="fa-solid fa-shield-halved"></i>
                    Admin
                </span>
                <div class="avatar">A</div>
            </div>

        </header>


        <!-- DYNAMIC CONTENT -->
        <section id="content">

        </section>

    </main>

</div>


<!-- MODAL -->
<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-header">
            <h3 id="modal-title">Add New</h3>
            <button id="close-modal" class="close-btn" type="button">
                &times;
            </button>
        </div>

        <form id="modal-form">
            <div id="modal-fields"></div>

            <div class="modal-actions">
                <button type="button" class="btn btn-light" id="cancel-modal">
                    Cancel
                </button>

                <button type="submit" class="btn btn-primary">
                    Save Details
                </button>
            </div>
        </form>

    </div>

</div>


<!-- JAVASCRIPT CONNECTION -->
<script src="script.js"></script>

</body>
</html>
